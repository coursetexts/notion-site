name: Build

on: [push, pull_request]

# A push to a branch that also has an open PR triggers this workflow twice.
# Cancel the older run instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs everywhere, including pull requests from forks: neither eslint nor tsc
  # needs a Notion page id or any other secret.
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - run: yarn install --frozen-lockfile
      - name: lint
        run: yarn test:lint
      - name: typecheck
        run: npx tsc --noEmit

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - run: yarn install --frozen-lockfile
      - name: build
        env:
          NEXT_PUBLIC_NOTION_PAGE_ID: ${{ secrets.NEXT_PUBLIC_NOTION_PAGE_ID }}
        run: |
          # `next build` runs getStaticProps, which fetches the site's root Notion page,
          # so the build fails outright without a page id
          # (`Config error: missing required site config key "rootNotionPageId"`).
          # GitHub withholds secrets from pull requests opened from forks, which is why
          # every fork PR used to fail here. Fall back to the production page id already
          # committed as NOTION_PRODUCTION_URL in lib/consts.ts — it is a public Notion
          # page, not a secret — so fork PRs get a real build too. Read from the file
          # rather than duplicating the value, so there is one source of truth.
          if [ -z "$NEXT_PUBLIC_NOTION_PAGE_ID" ]; then
            NEXT_PUBLIC_NOTION_PAGE_ID=$(sed -n "s/.*NOTION_PRODUCTION_URL *= *'\\([^']*\\)'.*/\\1/p" lib/consts.ts)
            echo "No NEXT_PUBLIC_NOTION_PAGE_ID secret (expected on fork PRs); using the public production page id from lib/consts.ts"
          fi
          export NEXT_PUBLIC_NOTION_PAGE_ID

          # REASON: Notion's unofficial API (api/v3/loadPageChunk) intermittently returns
          # 403 to GitHub-hosted runners — it blocks/rate-limits datacenter IPs, and
          # getPageWithRetry's six attempts in lib/notion-api.ts all fail. That is an
          # outage on Notion's side, not a broken commit, and it used to red-X the repo
          # for changes that could not possibly have caused it. So: run the build, and if
          # the ONLY failure is that 403, warn and pass. Every other build failure still
          # fails the job. Remove this and CI goes red whenever Notion blocks Actions.
          if yarn build 2>&1 | tee build.log; then
            exit 0
          fi
          if grep -q "403 Forbidden: POST https://www.notion.so" build.log; then
            echo "::warning::Notion returned 403 to this runner, so the Next.js build could not fetch page data. Build verification skipped — rerun the job, or build locally with a real NEXT_PUBLIC_NOTION_PAGE_ID."
            exit 0
          fi
          exit 1
